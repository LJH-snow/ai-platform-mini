server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API traffic is proxied to the backend container; the SPA itself
    # never talks to the host directly.
    #
    # SSE/streaming requirements (Agent Trace, chat deltas):
    #   proxy_buffering off  — incremental responses must reach the
    #                          browser immediately, never buffered
    #   proxy_read_timeout   — long-lived streaming connections
    #   HTTP/1.1 + empty Connection header — upstream keep-alive
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /v1/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri /index.html;
    }
}
