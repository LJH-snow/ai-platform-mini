services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_DEFAULT_MODEL=qwen3:4b
      - LOG_LEVEL=INFO
      - AUTH_STORAGE=postgres
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/aiplatform
      - INITIAL_API_KEY=${INITIAL_API_KEY:?INITIAL_API_KEY must be set}
      - ADMIN_API_KEYS=${ADMIN_API_KEYS:?ADMIN_API_KEYS must be set}

    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiplatform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ollama-data:
  postgres-data:
