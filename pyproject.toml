[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platform-mini"
version = "0.1.0"
description = "Minimal AI platform backend scaffold."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi",
    "httpx",
    "jieba>=0.42.1",
    "pgvector",
    "pypdf>=5.0,<7.0",
    "python-multipart>=0.0.9,<1.0",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "uvicorn[standard]",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "psycopg[binary]>=3.3,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["."]
